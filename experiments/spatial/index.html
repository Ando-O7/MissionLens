// Terrain-local frame: metres, +x east, +z south, y = height above the lowest point of the area.

// Room mock: stands in for what passthrough would show. Fades out when the terrain takes over.
const room = new THREE.Group(); scene.add(room);

{ const floor = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), rm(0x33373d)); floor.rotation.x = -Math.PI / 2; room.add(floor);

const [tOrtho, tSlope, tCrism] = await Promise.all([loadTex(AOI + 'ortho.jpg'), loadTex(AOI + 'slope.png'), loadTex(AOI + CR.file)]);

tCrism.magFilter = tCrism.minFilter = THREE.NearestFilter; tCrism.generateMipmaps = false;  // show the 18 m cells as they are

  const x0 = Math.min(...xs), x1 = Math.max(...xs), z0 = Math.min(...zs), z1 = Math.max(...zs), AR = .86 / .79, hx = Math.max((x1 - x0) / 2 + 60, ((z1 - z0) / 2 + 60) * AR), hz = hx / AR;

  for (let z = cz - hz; z <= cz + hz; z += 4) for (let x = cx - hx; x <= cx + hx; x += 4) lo = Math.min(lo, elevLocal(x, z));

{ const slab = new THREE.Mesh(new THREE.BoxGeometry(WIN.hx * 2, 3, WIN.hz * 2), new THREE.MeshBasicMaterial({ color: 0x15171a })); slab.position.set(WIN.cx, WIN.baseY + 1.4, WIN.cz); world.add(slab); }

  const d = cx.getImageData(0, 0, im.width, im.height).data, red = Float32Array.from({ length: im.width * im.height }, (_, i) => d[i * 4]), sorted = Float32Array.from(red).sort();

// Planned route: a 0.5 m wide ribbon on the ground (readable at 1:1) and a 3 m wide one for the table model.
const legObjs = M.legs.map((leg, li) => {
  const p = leg.route.map(([x, z]) => new THREE.Vector3(x, elevLocal(x, z) + 1.2, z));
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(p), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true }));
  const v = [], wv = [], ix = [];

// ---------- view state ----------

const tweens = [];

const task = () => M.tasks[Math.min(taskIndex, M.tasks.length - 1)], finished = () => taskIndex >= M.tasks.length;

    const mk = marks.filter(m => m.station === s.id).length;
    let sub = ''; if (table) sub = [s.id === here ? 'you are here' : '', mk ? `${mk} marked` : ''].filter(Boolean).join(' · '); else if (s.id !== here) { const b = bearingXZ(view.ax, view.az, s.id); sub = `${(stage === 'field' ? bearing(here, s.id).d : b.d).toFixed(0)} m${stage === 'field' && !ST[here].sees[s.id] ? ' · behind terrain' : ''}`; }
    const full = table ? s.id === sel : isNext || (finished() && s.id !== here);
    sp.material.map?.dispose(); sp.material.map = makeLabel(full ? `${s.id} ${s.name}` : s.id, full ? sub : sub.split(' · ')[0], table && s.id === sel ? CYAN : isNext && !table ? AMBER : '#ffffff', LEFT[s.id]); sp.material.needsUpdate = true; sp.renderOrder = full ? 11 : 10;
    const k = table && !full ? .72 : 1; sp.scale.set(.34 * k, .068 * k, 1); }
  for (const o of legObjs) { const next = stage === 'table' ? o.li === selLeg : !finished() && ((o.leg.from === here && o.leg.to === T.station) || (o.leg.to === here && o.leg.from === T.station));
    o.line.visible = false; o.ribbon.visible = stage !== 'table'; o.wide.visible = stage === 'table'; o.ribbon.material.opacity = next ? .42 : .14; o.wide.material.opacity = next ? .95 : .4; o.wide.material.color.set(next ? 0x5fd4ff : 0xffffff); }
  $('stage').textContent = { table: 'PLAN — tabletop model in the room (MR)', giant: 'PLAN — route preview at 1 : 25 (VR)', walk: 'FIELD — terrain model at true scale (VR)', field: `FIELD — surface image at ${ST[here].name} (VR)` }[stage];
  $('prov').innerHTML = { table: '<i>Room is a mock.</i> On Quest this is passthrough: the model sits on your real desk, the briefing board stands behind it. Model: MRO HiRISE terrain and image, ' + SCALE_TXT + ', cut to the area this Marswalk uses.',
    giant: '<i>Orbital data only.</i> MRO HiRISE terrain model and image, scaled so you stand 40 m tall. Only the planned route is drawn on it. Sky is a flat placeholder.',
    walk: '<i>Orbital data only.</i> MRO HiRISE terrain model and image at true scale. Near ground is blurred because the image is 0.3 m per pixel. Sky is a flat placeholder.',
    field: '<i>NASA observation + our overlay.</i> Official Mastcam-Z panorama; its direction was assigned by us (skyline fit to the HiRISE terrain). Labels, path and marks are placed from map coordinates. Where the mosaic has no pixels, the terrain model shows through.' }[stage];
  if (stage === 'table') { drawBoard(); drawStrip(); } else { drawWrist(); drawHud(); }
}

// ---------- input ----------
let down = null; const keys = {};
renderer.domElement.addEventListener('pointerdown', e => down = { x: e.clientX, y: e.clientY, hdg, pitch, moved: false });
addEventListener('pointermove', e => { if (!down) return; if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 4) down.moved = true; if (!down.moved) return;
  const k = cam.fov / innerHeight; hdg = (down.hdg - (e.clientX - down.x) * k + 360) % 360; pitch = Math.max(-85, Math.min(60, down.pitch + (e.clientY - down.y) * k)); lastDrag = performance.now(); });
addEventListener('pointerup', e => { const d = down; down = null; if (!d || d.moved || busy) return;
  mouse.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(mouse, cam);
  for (const s of surfaces) { if (!s.mesh.visible || ((s === board || s === strip) && stage !== 'table')) continue; const h = ray.intersectObject(s.mesh)[0]; if (!h) continue;
    const x = h.uv.x * s.w, y = (1 - h.uv.y) * s.h, b = s.buttons.findLast(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h); if (b) b.fn(); return; }
  // Labels of nearby stations overlap; take the one whose anchor is closest to the pinch, not the nearest in depth.
  const d2 = o => { const p = o.position.clone().project(cam); return Math.hypot((p.x + 1) / 2 * innerWidth - e.clientX, (1 - p.y) / 2 * innerHeight - e.clientY); };
  const hit = ray.intersectObjects(pinObjs.filter(p => p.visible)).sort((a, b) => d2(a.object) - d2(b.object))[0];
  if (hit) { const id = hit.object.userData.id; if (stage === 'table') selectStation(id); else if (stage === 'field' && id !== here) travel(id); else if (stage !== 'field') toField(id); return; }
  // Pointing at the scenery during a search task records a candidate where the ray meets the terrain model.
  if (stage === 'field' && !finished() && task().station === here && task().record_check !== undefined) { const p = pointOnTerrain(); if (p) addMark(p); else flash('No terrain model in that direction'); } });
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key === 'Escape') toTable(); if (e.key === ' ') { e.preventDefault(); if (stage !== 'table' && !e.repeat) { wristUp = !wristUp; refresh(); } } }); addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });

// URL presets so states can be captured without input: ?stage=table|giant|walk|field&station=B&hdg=20&pitch=-5&layer=slope|crism&task=3&seltask=5&wrist=1&panel=0
{ const st = q.get('station'), sg = q.get('stage') || 'table'; if (st) selectStation(st); if (q.get('seltask')) selectTask(+q.get('seltask')); if (q.get('hdg')) hdg = +q.get('hdg'); if (q.get('pitch')) pitch = +q.get('pitch');
  layer = q.get('layer') || (q.get('slope') ? 'slope' : 'none'); if (sg === 'table') { tUni.oSlope.value = +(layer === 'slope'); tUni.oCrism.value = +(layer === 'crism'); } if (q.get('here')) here = q.get('here');
  if (sg !== 'table') { stage = sg; roomT = roomO = 0; wristUp = q.get('wrist') ? q.get('wrist') === '1' : sg !== 'field'; if (!q.get('pitch')) pitch = -6; Object.assign(view, atStation(sel), { S: sg === 'giant' ? S_GIANT : 1, wy: sg === 'field' ? EYE - 2.0 : 0 });
    if (sg === 'field') { here = sel; if (!q.get('hdg')) hdg = ST[sel].view.az; await showPano(sel); panoT = 1; panoUni.opacity.value = 1; } }
  applyView(); world.updateMatrixWorld(); refresh(); }

// Scripted run for unattended checks: ?auto=field:BASE,travel:A,done,giant:B,walk:B,table,wait:800
if (q.get('auto')) (async () => { for (const c of q.get('auto').split(',')) { const [k, v] = c.split(':');
  if (k === 'table') await toTable(); else if (k === 'giant') await enterTerrain(v, S_GIANT); else if (k === 'walk') await enterTerrain(v, 1); else if (k === 'field') await toField(v);
  else if (k === 'travel') await travel(v); else if (k === 'done') { taskIndex++; done = new Set(); refresh(); } else if (k === 'wait') await tween(+v / 1000, () => {}); } document.title = 'auto done'; })();

// Hooks for an automated driver (experiments/spatial/drive.mjs): read state, and get screen positions to click.
let frames = 0;
const toScreen = v => { const p = v.clone().project(cam); return [Math.round((p.x + 1) / 2 * innerWidth), Math.round((1 - p.y) / 2 * innerHeight)]; };
window.__ml = {
  state: () => ({ stage, here, sel, selTask, busy, taskIndex, done: [...done], layer, wrist: wristUp, pano: +panoUni.opacity.value.toFixed(2), room: +roomO.toFixed(2), hdg: +hdg.toFixed(1), pitch: +pitch.toFixed(1), S: view.S, ax: +view.ax.toFixed(1), az: +view.az.toFixed(1), frames,
    slope: +tUni.oSlope.value.toFixed(2), crism: +tUni.oCrism.value.toFixed(2), board: board.mesh.visible, hud: hud.mesh.visible, wristShown: wrist.mesh.visible, crismRank,
    marks: marks.map(m => ({ n: m.n, station: m.station, d: +m.d.toFixed(1), az: +m.az.toFixed(1), x: +m.x.toFixed(1), z: +m.z.toFixed(1) })) }),
  btn: label => { const vis = surfaces.filter(s => s.mesh.visible); let s, b;
    for (const f of [x => x.label === label, x => x.label && x.label.startsWith(label)]) { for (s of vis) if ((b = s.buttons.find(f))) break; if (b) break; }
    if (!b) return null; const g = s.mesh.geometry.parameters; return toScreen(s.mesh.localToWorld(new THREE.Vector3(((b.x + b.w / 2) / s.w - .5) * g.width, (.5 - (b.y + b.h / 2) / s.h) * g.height, 0))); },
  pin: id => { const sp = pinObjs.find(p => p.userData.id === id); return sp && sp.visible ? toScreen(sp.position) : null; },
  labels: () => surfaces.filter(s => s.mesh.visible).flatMap(s => s.buttons.map(b => b.label)),
};

let last = performance.now(), hudKey = '';
renderer.setAnimationLoop(now => { frames++;
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  for (let i = tweens.length - 1; i >= 0; i--) { const t = tweens[i]; t.t = Math.min(1, t.t + dt / t.dur); t.fn(t.t); if (t.t === 1) { tweens.splice(i, 1); t.res(); } }
  const a = hdg * Math.PI / 180, f = (keys.w ? 1 : 0) - (keys.s ? 1 : 0), s = (keys.d ? 1 : 0) - (keys.a ? 1 : 0), mx = Math.sin(a) * f + Math.cos(a) * s, mz = -Math.cos(a) * f + Math.sin(a) * s;
  if ((f || s) && !busy) {
    if (stage === 'table') { cam.position.x = Math.max(-2.5, Math.min(2.5, cam.position.x + mx * 1.2 * dt)); cam.position.z = Math.max(-2.5, Math.min(2.8, cam.position.z + mz * 1.2 * dt)); }
    else if (stage !== 'field') { const v = (keys.shift ? 6 : 1.6) * dt / view.S; view.ax = Math.max(-sx / 2 + 3, Math.min(sx / 2 - 3, view.ax + mx * v)); view.az = Math.max(-sy / 2 + 3, Math.min(sy / 2 - 3, view.az + mz * v)); applyView(); }
  }
  roomO += (roomT - roomO) * Math.min(1, dt * 3); for (const m of roomMats) m.opacity = m.userData.o * roomO; room.visible = roomO > .01;
  scene.background.copy(ROOM_BG).lerp(skyNow, 1 - roomO);
  board.mesh.material.opacity = strip.mesh.material.opacity = roomO; board.mesh.visible = strip.mesh.visible = showPanels && roomO > .02;
  wrist.mesh.visible = showPanels && stage !== 'table' && wristUp; hud.mesh.visible = showPanels && stage !== 'table';
  panoUni.opacity.value += (panoT - panoUni.opacity.value) * Math.min(1, dt * 2.5); if (panoMesh) { panoMesh.visible = panoUni.opacity.value > .01; panoMesh.position.copy(cam.position); }
  if (pendingPano && panoT === 0 && panoUni.opacity.value < .02) { const id = pendingPano; pendingPano = null; showPano(id); }
  const lay = stage === 'table' ? layer : 'none', kf = Math.min(1, dt * 5);
  tUni.oSlope.value += ((lay === 'slope') - tUni.oSlope.value) * kf; tUni.oCrism.value += ((lay === 'crism') - tUni.oCrism.value) * kf; tUni.dim.value = panoUni.opacity.value * .85; tUni.clipG.value += ((stage !== 'table') - tUni.clipG.value) * Math.min(1, dt * 2);
  cam.rotation.set(pitch * Math.PI / 180, -a, 0); world.updateMatrixWorld();
  for (const sp of pinObjs) { sp.position.copy(sp.userData.local).applyMatrix4(world.matrixWorld); sp.visible = !(stage !== 'table' && sp.userData.id === here && Math.hypot(view.ax - ST[here].x, view.az - ST[here].y) < 6); }
  const ms = stage === 'table' ? .03 : .058; for (const m of marks) { m.sp.position.copy(m.sp.userData.local).applyMatrix4(world.matrixWorld); m.sp.scale.set(ms, ms, 1); }
  if (flashMsg && now > flashUntil) { flashMsg = ''; hudKey = ''; }
  if (stage !== 'table') { const k = `${Math.round(hdg)}|${Math.round(view.ax)}|${Math.round(view.az)}`; if (k !== hudKey) { hudKey = k; drawHud(); } }
  $('sub').textContent = stage === 'table' ? `heading ${deg3(hdg)}°` : `heading ${deg3(hdg)}° · ${((view.ax / sx + .5) * (L.bounds.lon_max - L.bounds.lon_min) + L.bounds.lon_min).toFixed(5)}°E ${(L.bounds.lat_max - (view.az / sy + .5) * (L.bounds.lat_max - L.bounds.lat_min)).toFixed(5)}°N`;
  renderer.render(scene, cam);
});
</script>
