// Desktop stand-in for the Quest experience: one continuous space that goes from a tabletop model in the

THREE.ColorManagement.enabled = false;

// Terrain-local frame: metres, +x east, +z south, y = height above the lowest point of the area.

// Planned route: a 1 px line (readable on the table) plus a 1.2 m wide ribbon on the ground (readable at 1:1).

// Surface image: the official Mastcam-Z panorama for a station, north-aligned, drawn over the 1:1 terrain.
const panoCache = {}, panoUni = { map: { value: null }, opacity: { value: 0 } };
const panoMat = new THREE.ShaderMaterial({ uniforms: panoUni, side: THREE.DoubleSide, transparent: true, depthTest: false, depthWrite: false,
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
  // Pixels the mosaic does not cover are black; drop them so the terrain model shows through instead of a hole.
  fragmentShader: 'uniform sampler2D map; uniform float opacity; varying vec2 vUv; void main(){ vec3 c = texture2D(map, vUv).rgb; if (c.r + c.g + c.b < .05) discard; gl_FragColor = vec4(c, opacity * smoothstep(1., .93, vUv.y)); }' });
let panoMesh = null;
async function loadPano(id) {

// ---------- view state ----------
// The user never moves through the room; the terrain is placed around them. `view` says which terrain
// point (ax, az) sits at which room position (wx, wy, wz) and at what scale.
const S_TABLE = 1 / 1500, S_GIANT = 1 / 25;
const view = { S: S_TABLE, ex: 1, ax: 0, az: 0, ground: false, wx: 0, wy: DESK_Y, wz: 0 };
function applyView(v = view) {
  const h = v.ground ? elevLocal(v.ax, v.az) : 0;
  world.scale.set(v.S, v.S * v.ex, v.S); world.position.set(v.wx - v.S * v.ax, v.wy - v.S * v.ex * h, v.wz - v.S * v.az);

const tweens = [];

const ease = k => k * k * (3 - 2 * k);

let stage = 'table', here = 'BASE', sel = 'A', busy = false, taskIndex = +(q.get('task') ?? 0), done = new Set();
let roomT = 1, roomO = 1, panoT = 0, slopeT = 0, hdg = 0, pitch = -34, lastDrag = 0;
const task = () => M.tasks[Math.min(taskIndex, M.tasks.length - 1)], finished = () => taskIndex >= M.tasks.length;

async function toTable() {

function routeBetween(a, b) {

// ---------- wrist panel ----------

      text(`Measured here, sol 502, ${hm(MEDA.series.lmst_h[i] * 60)} local: ${v('pressure_pa')?.toFixed(0)} Pa · air ${(v('air_temp_k') - 273.15).toFixed(0)} °C`, 34, y, '#9aa0a8'); }

}
function nearest() { let best = null; for (const s of M.stations) { const d = Math.hypot(s.x - view.ax, s.y - view.az); if (!best || d < best.d) best = { id: s.id, d }; } return best; }
async function rescale(S) { if (busy) return; busy = true; stage = S === 1 ? 'walk' : 'giant'; refresh(); await flyTo({ ...view, S, ex: 1, ground: true, wx: cam.position.x, wy: 0, wz: cam.position.z }, 1.8); busy = false; refresh(); }

    let sub = ''; if (stage !== 'table' && s.id !== here) { const b = bearing(here, s.id); sub = `${b.d.toFixed(0)} m${stage === 'field' && !ST[here].sees[s.id] ? ' · behind terrain' : ''}`; }
    const full = stage === 'table' ? s.id === sel : isNext || (finished() && s.id !== here);
    sp.material.map?.dispose(); sp.material.map = makeLabel(full ? `${s.id} ${s.name}` : s.id, full ? sub : sub.split(' · ')[0], stage === 'table' && s.id === sel ? '#5fd4ff' : isNext ? '#ffb347' : '#ffffff'); sp.material.needsUpdate = true; sp.renderOrder = full ? 11 : 10; }

  $('stage').textContent = { table: 'PLAN — tabletop model in the room (MR)', giant: 'TERRAIN — walking the model at 1 : 25 (VR)', walk: 'TERRAIN — inside the model at true scale (VR)', field: `FIELD — surface image at ${ST[stage === 'field' ? sel : here].name} (VR)` }[stage];
  $('note').innerHTML = { table: '<b>Room is a mock.</b> On Quest this would be passthrough: the terrain model sits on your real desk. Model: MRO HiRISE terrain and image, 1 : 1500.',
    giant: '<b>Orbital data only.</b> MRO HiRISE terrain model and image, scaled so you stand 40 m tall. No overlays except the planned route. Sky is a flat placeholder.',

// ---------- input ----------
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let down = null; const keys = {};
renderer.domElement.addEventListener('pointerdown', e => down = { x: e.clientX, y: e.clientY, hdg, pitch, moved: false });
addEventListener('pointermove', e => { if (!down) return; if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 4) down.moved = true; if (!down.moved) return;
  const k = cam.fov / innerHeight; hdg = (down.hdg - (e.clientX - down.x) * k + 360) % 360; pitch = Math.max(-85, Math.min(60, down.pitch + (e.clientY - down.y) * k)); lastDrag = performance.now(); });
addEventListener('pointerup', e => { const d = down; down = null; if (!d || d.moved || busy) return;
  mouse.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(mouse, cam);
  const ph = panel.visible && ray.intersectObject(panel)[0];
  if (ph) { const x = ph.uv.x * PW, y = (1 - ph.uv.y) * PH, b = buttons.findLast(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h); if (b) b.fn(); return; }

  const d2 = o => { const p = o.position.clone().project(cam); return Math.hypot((p.x + 1) / 2 * innerWidth - e.clientX, (1 - p.y) / 2 * innerHeight - e.clientY); };
  const hit = ray.intersectObjects(pinObjs).sort((a, b) => d2(a.object) - d2(b.object))[0]; if (hit) { const id = hit.object.userData.id; if (stage === 'table') { sel = id; refresh(); } else if (stage === 'field' && id !== here) travel(id); else if (stage !== 'field') toField(id); } });
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key === 'Escape') toTable(); }); addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// URL presets so states can be captured without input: ?stage=table|giant|walk|field&station=B&hdg=20&pitch=-5&slope=1&task=3&panel=0
{ const st = q.get('station'), sg = q.get('stage') || 'table'; if (st) sel = st; if (q.get('hdg')) hdg = +q.get('hdg'); if (q.get('pitch')) pitch = +q.get('pitch'); if (q.get('slope')) { slopeT = 1; tUni.oSlope.value = 1; } if (q.get('here')) here = q.get('here');

if (q.get('auto')) (async () => { for (const c of q.get('auto').split(',')) { const [k, v] = c.split(':');
  if (k === 'table') await toTable(); else if (k === 'giant') await enterTerrain(v, S_GIANT); else if (k === 'walk') await enterTerrain(v, 1); else if (k === 'field') await toField(v);
  else if (k === 'travel') await travel(v); else if (k === 'done') { taskIndex++; done = new Set(); refresh(); } else if (k === 'wait') await tween(+v / 1000, () => {}); } document.title = 'auto done'; })();

  state: () => ({ stage, here, sel, busy, taskIndex, done: [...done], pano: +panoUni.opacity.value.toFixed(2), room: +roomO.toFixed(2), hdg: +hdg.toFixed(1), S: view.S, ax: +view.ax.toFixed(1), az: +view.az.toFixed(1), frames, slope: +tUni.oSlope.value.toFixed(2) }),

let last = performance.now();
